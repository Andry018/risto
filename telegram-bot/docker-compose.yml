version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: risto-telegram-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  ollama:
    image: ollama/ollama:latest
    container_name: risto-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_THREAD=4
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_FLASH_ATTENTION=0

volumes:
  ollama_data: