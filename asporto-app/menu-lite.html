<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Rete di sicurezza: se lo script si blocca, la pagina si ricarica da sola ogni 30 minuti -->
<meta http-equiv="refresh" content="1800">
<title>Menu · Il Girasole</title>
<!--
  Menu leggero per Kindle / e-ink.
  Niente React, niente animazioni, niente font esterni: HTML + CSS semplice e JS ES5
  (gira anche sui browser vecchi del Kindle). Legge i piatti disponibili da /rest/v1
  con la chiave anon (stessa lettura pubblica della pagina /menu).

  Parametri URL (combinabili):
    ?cat=Primi,Secondi   solo queste categorie (per più Kindle con parti diverse del menu)
    ?size=s|m|l|xl       dimensione testo (default m)
    ?col=1|2             colonne (default: 2 se lo schermo è largo, altrimenti 1)
    ?ingr=0              nasconde gli ingredienti
    ?prezzi=0            nasconde i prezzi
    ?refresh=1           minuti tra un controllo e l'altro (default 1). Lo schermo
                         si ridisegna solo se i piatti sono cambiati.
-->
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { font-family: Georgia, "Times New Roman", serif; font-size: 20px; line-height: 1.3; padding: 18px 22px 30px; }
  body.size-s  { font-size: 16px; }
  body.size-l  { font-size: 24px; }
  body.size-xl { font-size: 30px; }
  .head { border-bottom: 3px solid #000; padding-bottom: 8px; margin-bottom: 6px; }
  .head table { width: 100%; border-collapse: collapse; }
  .title { font-size: 1.7em; font-weight: bold; letter-spacing: 0.02em; }
  .sub { font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.15em; }
  .date { text-align: right; font-size: 0.85em; vertical-align: bottom; }
  .cols2 { -webkit-column-count: 2; -moz-column-count: 2; column-count: 2; -webkit-column-gap: 34px; column-gap: 34px; }
  .cat { -webkit-column-break-inside: avoid; break-inside: avoid; page-break-inside: avoid; }
  h2 { font-size: 1.15em; text-transform: uppercase; letter-spacing: 0.12em; margin: 18px 0 6px; padding-bottom: 3px; border-bottom: 1px solid #000;
       -webkit-column-break-after: avoid; break-after: avoid; }
  h3 { font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.1em; margin: 10px 0 2px; font-style: italic; font-weight: normal; }
  table.items { width: 100%; border-collapse: collapse; }
  table.items td { padding: 5px 0 5px; vertical-align: top; }
  tr.item { -webkit-column-break-inside: avoid; break-inside: avoid; }
  .name { font-weight: bold; }
  .ingr { font-size: 0.78em; font-style: italic; display: block; margin-top: 1px; }
  .price { text-align: right; white-space: nowrap; padding-left: 14px !important; font-weight: bold; width: 1%; }
  .foot { margin-top: 22px; border-top: 1px solid #000; padding-top: 6px; font-size: 0.7em; }
  .msg { margin: 40px 0; font-size: 1.1em; text-align: center; }
</style>
</head>
<body>
  <div class="head">
    <table><tr>
      <td><div class="title">Il Girasole</div><div class="sub">Menu del giorno</div></td>
      <td class="date" id="date"></td>
    </tr></table>
  </div>
  <div id="menu"><p class="msg">Caricamento menu…</p></div>
  <div class="foot" id="foot">&nbsp;</div>

<script>
(function () {
  var ANON_KEY = '%VITE_SUPABASE_ANON_KEY%';
  var CATEGORY_ORDER = ['Antipasti', 'Fritti', 'Primi', 'Secondi', 'Pizze Rosse', 'Pizze Bianche', 'Pizze Speciali', 'Dolci', 'Caffè e Liquori', 'Bevande'];
  var HIDDEN = { 'EXTRA': 1, 'Servizio': 1 };
  var MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  var GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];

  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  }

  var size = param('size');
  if (size === 's' || size === 'l' || size === 'xl') document.body.className = 'size-' + size;
  var col = param('col');
  var twoCols = col ? col === '2' : (window.innerWidth || document.documentElement.clientWidth) >= 900;
  var showIngr = param('ingr') !== '0';
  var showPrezzi = param('prezzi') !== '0';
  var refreshMin = parseFloat(param('refresh')) || 1;
  if (refreshMin < 0.5) refreshMin = 0.5;
  var onlyCats = null;
  if (param('cat')) {
    onlyCats = {};
    var parts = param('cat').split(',');
    for (var i = 0; i < parts.length; i++) {
      var c = parts[i].replace(/^\s+|\s+$/g, '').toLowerCase();
      if (c) onlyCats[c] = 1;
    }
  }

  var menuEl = document.getElementById('menu');
  var footEl = document.getElementById('foot');
  var lastJson = null;
  var offline = false;
  var lastStamp = '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function euro(n) { return '€ ' + Number(n || 0).toFixed(2).replace('.', ','); }
  function orderOf(cat) {
    for (var i = 0; i < CATEGORY_ORDER.length; i++) if (CATEGORY_ORDER[i] === cat) return i;
    return 100;
  }

  function setDate() {
    var d = new Date();
    var el = document.getElementById('date');
    var txt = esc(GIORNI[d.getDay()] + ' ' + d.getDate() + ' ' + MESI[d.getMonth()]);
    if (el.innerHTML !== txt) el.innerHTML = txt; // tocca lo schermo solo al cambio di giorno
  }

  function itemRows(list) {
    var h = '';
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var ingr = (showIngr && p.ingredienti && p.ingredienti.length) ? '<span class="ingr">' + esc(p.ingredienti.join(', ')) + '</span>' : '';
      h += '<tr class="item"><td><span class="name">' + esc(p.nome) + '</span>' + ingr + '</td>' +
           (showPrezzi ? '<td class="price">' + euro(p.prezzo) + '</td>' : '') + '</tr>';
    }
    return '<table class="items">' + h + '</table>';
  }

  function render(products) {
    var groups = {}, cats = [];
    for (var i = 0; i < products.length; i++) {
      var p = products[i];
      var cat = p.categoria || 'Altro';
      if (HIDDEN[cat]) continue;
      if (onlyCats && !onlyCats[cat.toLowerCase()]) continue;
      if (!groups[cat]) { groups[cat] = []; cats.push(cat); }
      groups[cat].push(p);
    }
    cats.sort(function (a, b) { return orderOf(a) - orderOf(b) || (a < b ? -1 : a > b ? 1 : 0); });

    if (!cats.length) {
      menuEl.innerHTML = '<p class="msg">Nessun piatto disponibile al momento.</p>';
      return;
    }

    var h = '';
    for (var c = 0; c < cats.length; c++) {
      var list = groups[cats[c]];
      list.sort(function (a, b) { return a.nome < b.nome ? -1 : a.nome > b.nome ? 1 : 0; });
      var hasSub = false;
      for (var k = 0; k < list.length; k++) if (list[k].sottocategoria) { hasSub = true; break; }
      h += '<div class="cat"><h2>' + esc(cats[c]) + '</h2>';
      if (hasSub) {
        var subs = [], bySub = {};
        for (var j = 0; j < list.length; j++) {
          var s = list[j].sottocategoria || 'Altro';
          if (!bySub[s]) { bySub[s] = []; subs.push(s); }
          bySub[s].push(list[j]);
        }
        for (var t = 0; t < subs.length; t++) h += '<h3>' + esc(subs[t]) + '</h3>' + itemRows(bySub[subs[t]]);
      } else {
        h += itemRows(list);
      }
      h += '</div>';
    }
    menuEl.className = twoCols ? 'cols2' : '';
    menuEl.innerHTML = h;
  }

  function stamp(text) {
    var d = new Date();
    footEl.innerHTML = esc(text + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()));
  }

  function load() {
    setDate();
    var xhr;
    try { xhr = new XMLHttpRequest(); } catch (e) { return; }
    var url = '/rest/v1/prodotti?select=nome,prezzo,categoria,sottocategoria,ingredienti&disponibile=eq.true&order=categoria.asc,nome.asc';
    xhr.open('GET', url, true);
    xhr.setRequestHeader('apikey', ANON_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + ANON_KEY);
    xhr.setRequestHeader('Accept', 'application/json');
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        // Ridisegna solo se il menu è cambiato: sull'e-ink ogni ridisegno fa lampeggiare lo schermo
        if (xhr.responseText !== lastJson) {
          var data;
          try { data = JSON.parse(xhr.responseText); } catch (e) { stamp('Risposta non valida, riprovo. Ultimo tentativo'); return; }
          lastJson = xhr.responseText;
          render(data);
          stamp('Menu aggiornato alle');
          lastStamp = footEl.innerHTML;
        } else if (offline) {
          footEl.innerHTML = lastStamp;
        }
        offline = false;
      } else {
        if (lastJson === null) menuEl.innerHTML = '<p class="msg">Menu non raggiungibile (errore ' + xhr.status + '). Riprovo tra poco…</p>';
        if (!offline) stamp('Connessione assente, riprovo ogni minuto. Dalle');
        offline = true;
      }
    };
    xhr.send(null);
  }

  load();
  setInterval(load, refreshMin * 60 * 1000);
})();
</script>
</body>
</html>
