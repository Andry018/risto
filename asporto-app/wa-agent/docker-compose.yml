# Evolution API (sessione WhatsApp) + Postgres dedicato.
# Avvio sul CT:  cd /opt/risto/asporto-app/wa-agent && docker compose up -d
# Le variabili vengono dal .env di questa cartella (lo stesso del wa-agent).
#
# Porta esposta SOLO su 127.0.0.1: dal browser si passa sempre dal wa-agent (token + API key nascosta).
# Quando funziona, fissa il tag dell'immagine alla versione in uso invece di :latest.

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: risto-evolution
    restart: unless-stopped
    depends_on:
      - evolution-postgres
    ports:
      - "127.0.0.1:8085:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # per chiamare il webhook del wa-agent sull'host
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://127.0.0.1:8085
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: risto
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: Gestionale Risto
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 30
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:16-alpine
    container_name: risto-evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

volumes:
  evolution_instances:
  evolution_pg:
