<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comande Agriturismo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="tavolo-box">
    <label>Tavolo attivo</label>
    <div id="tavoloAttivoLabel" class="tavolo-attivo-label">Nessun tavolo selezionato</div>
  </div>
  <div class="tavolo-box">
    <label>Adulti</label>
    <input id="copertiAdultiInput" type="number" min="0" value="0" style="width:70px" disabled>
  </div>
  <div class="tavolo-box">
    <label>Bambini</label>
    <input id="copertiBambiniInput" type="number" min="0" value="0" style="width:70px" disabled>
  </div>
  <div class="spacer"></div>
  <div id="connStatus" class="conn-status">Connessione...</div>
  <button id="modificaMenuBtn" class="btn btn-secondary">Modifica menù</button>
</header>

<main class="layout">

  <section class="tavoli-panel">
    <h2>Tavoli</h2>
    <div id="tavoliLista" class="tavoli-lista"></div>
    <div class="nuovo-tavolo">
      <input id="nuovoTavoloInput" type="text" placeholder="Nome tavolo (es. Asporto 1)">
      <button id="aggiungiTavoloBtn" class="btn btn-secondary">+ Aggiungi</button>
    </div>
  </section>

  <section class="menu-panel">
    <nav id="categorieNav" class="categorie-nav"></nav>
    <div id="prodottiGrid" class="prodotti-grid"></div>
  </section>

  <aside class="carrello-panel">
    <h2>Comanda</h2>
    <div id="carrelloLista" class="carrello-lista"></div>
    <div class="carrello-totale">
      <span>Totale</span>
      <span id="totaleValore">€0.00</span>
    </div>
    <button id="cucinaBtn" class="btn btn-primary" disabled>Manda in cucina</button>
    <button id="contoBtn" class="btn btn-secondary" disabled>Stampa conto</button>
    <button id="chiudiTavoloBtn" class="btn btn-danger" disabled>Chiudi tavolo</button>
  </aside>

</main>

<!-- Modale note/portata per singolo articolo del carrello -->
<div id="noteModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="noteModalTitle">Articolo</h3>
    <label>Portata (uscita)</label>
    <select id="notePortata">
      <option value="1">1ª uscita</option>
      <option value="2">2ª uscita</option>
      <option value="3">3ª uscita</option>
    </select>
    <label>Note (es. senza cipolla, cottura...)</label>
    <textarea id="noteText" rows="3" placeholder="Note per la cucina"></textarea>
    <div class="modal-actions">
      <button id="noteAnnulla" class="btn btn-secondary">Annulla</button>
      <button id="noteSalva" class="btn btn-primary">Salva</button>
    </div>
  </div>
</div>

<!-- Modale modifica menù -->
<div id="menuEditModal" class="modal-overlay hidden">
  <div class="modal-box modal-box-large">
    <h3>Modifica menù</h3>
    <div id="menuEditContent" class="menu-edit-content"></div>
    <div class="nuovo-tavolo">
      <input id="nuovaCategoriaInput" type="text" placeholder="Nome nuova categoria (es. Contorni)">
      <button id="aggiungiCategoriaBtn" class="btn btn-secondary">+ Aggiungi categoria</button>
    </div>
    <div class="modal-actions">
      <button id="ripristinaMenuBtn" class="btn btn-danger">Ripristina default</button>
      <button id="chiudiMenuEditBtn" class="btn btn-primary">Chiudi</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
