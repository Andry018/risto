<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stazione di stampa — Agriturismo</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background:#2b2a27; color:#eee; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  .stato-box { max-width: 640px; margin: 60px auto; text-align:center; }
  .stato-box h1 { font-size: 22px; }
  #ultimaStampa { margin-top: 30px; font-size: 14px; color: #aaa; white-space: pre-line; }
  .puntino { display:inline-block; width:12px; height:12px; border-radius:50%; background:#3f5c3f; margin-right:8px; }
  .puntino.attesa { background:#c96a3a; }
</style>
</head>
<body>

<div class="stato-box">
  <h1><span id="puntino" class="puntino"></span>Stazione di stampa attiva</h1>
  <p>Tieni questa pagina aperta sul PC collegato alla stampante. Non serve toccarla: stampa da sola ogni comanda/conto inviato dai telefoni.</p>
  <div id="ultimaStampa">In attesa di comande...</div>
</div>

<div id="printArea" class="print-area">
  <div id="ticket" class="ticket"></div>
</div>

<script src="stampa.js"></script>
</body>
</html>
