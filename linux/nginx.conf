# Risto Il Girasole — Nginx (Linux / Proxmox CT)
# Percorso: /etc/nginx/nginx.conf
# Percorso repo: /opt/risto  (modificabile via RISTO_BASE in setup.sh)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile       on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    types {
        application/manifest+json webmanifest;
    }

    # ── HTTP ──────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost gestionale.90-minuti.it _;

        root  /opt/risto/asporto-app/dist;
        index index.html;

        location = /index.html  { add_header Cache-Control "no-cache"; }
        location /sw.js         { add_header Cache-Control "no-cache"; }
        location /registerSW.js { add_header Cache-Control "no-cache"; }
        location ~* \.js$       { add_header Cache-Control "no-cache"; }
        location / { try_files $uri $uri/ /index.html; }

        # Supabase API (REST, Auth, Storage, Realtime)
        location /rest/     { proxy_pass http://127.0.0.1:54321/rest/;     include /etc/nginx/proxy_supabase.conf; }
        location /auth/     { proxy_pass http://127.0.0.1:54321/auth/;     include /etc/nginx/proxy_supabase.conf; }
        location /storage/  { proxy_pass http://127.0.0.1:54321/storage/;  include /etc/nginx/proxy_supabase.conf; }
        location /realtime/ {
            proxy_pass http://127.0.0.1:54321/realtime/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /print-agent/ { rewrite ^/print-agent/(.*) /$1 break; proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
        # ECR Agent (PAX A35 + Custom RT) — proxato per evitare Mixed Content su HTTPS
        # Timeout lungo: il pagamento attende il cliente (fino a 90 s) + eventuale recupero esito.
        # Col default di 60 s nginx chiudeva la richiesta mentre il terminale stava ancora pagando.
        location /ecr-agent/   { rewrite ^/ecr-agent/(.*) /$1 break; proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; proxy_read_timeout 180s; }
        location = /admin      { return 301 /admin/; }
        # X-Risto-Lan sovrascritto sempre: da fuori non si può falsificare
        location /admin/       { proxy_pass http://127.0.0.1:4000/; proxy_set_header Host $host; proxy_set_header X-Risto-Lan ""; proxy_buffering off; }
        # File Manager (scrive file in /opt/risto): SOLO rete locale / Tailscale, MAI dal tunnel Cloudflare.
        # Il tunnel (CT 106) arriva da 192.168.1.106 → negato anche se è nella LAN.
        location /admin/api/files {
            deny  192.168.1.106;
            allow 192.168.1.0/24;
            allow 100.64.0.0/10;   # Tailscale
            allow 127.0.0.1;
            deny  all;
            if ($http_cf_connecting_ip) { return 403; }   # doppio controllo: richiesta passata da Cloudflare
            proxy_pass http://127.0.0.1:4000/api/files;
            proxy_set_header Host $host;
            proxy_set_header X-Risto-Lan "1";
            client_max_body_size 30m;   # upload in base64
        }

        # Open WebUI (Claude chat) — avviare con: docker run -d --name open-webui --restart always -p 3001:8080 ...
        location /claude/ {
            proxy_pass         http://127.0.0.1:3001/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 300s;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html { root /var/www/html; }
    }

    # ── HTTPS — Let's Encrypt via certbot (abilitare dopo setup) ─────────
    # Decommentare dopo: certbot --nginx -d gestionale.90-minuti.it
    #
    # server {
    #     listen 443 ssl;
    #     server_name gestionale.90-minuti.it;
    #
    #     ssl_certificate     /etc/letsencrypt/live/gestionale.90-minuti.it/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/gestionale.90-minuti.it/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     root  /opt/risto/asporto-app/dist;
    #     index index.html;
    #     ... (stesso contenuto del server HTTP sopra)
    # }
}
